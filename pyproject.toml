[build-system]
requires = ["setuptools>=45", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "uv-pre-commit"
version = "0.1.0"
description = "Pre-commit hook to prevent accidental commits of local path sources instead of git sources in pyproject.toml"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["pre-commit", "uv", "pyproject.toml", "git"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
]

[project.scripts]
check-uv-sources = "uv_pre_commit.check_sources:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
uv_pre_commit = ["py.typed"]
